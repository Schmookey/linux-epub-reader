name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload copyrighted books, DRM licences, credentials or private keys."
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any relevant error message.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution and version
    validations:
      required: true
