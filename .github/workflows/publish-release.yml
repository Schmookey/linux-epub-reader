name: Publish Linux EPUB Reader release

# Publishing is explicit: merging a release-preparation PR never publishes
# an unverified installer or an out-of-date release description.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (must match APP_VERSION)
        required: true
        type: string
        default: "0.14.0"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-linux-epub-reader-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"

      - name: Verify requested version and release notes
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APP_VERSION="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' src/linux_epub_reader.py | head -n 1)"
          test "$APP_VERSION" = "$REQUESTED_VERSION"
          TAG="v$APP_VERSION"
          NOTES="docs/releases/$TAG.md"
          test -s "$NOTES"
          grep -qx "Version: ${APP_VERSION}-1" packaging/debian/control
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Run tests and check source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mpv ffmpeg
          python -VV
          python -m py_compile src/*.py
          bash -n scripts/build-deb.sh
          python -m unittest discover -s tests -v

      - name: Build and validate Debian installer
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-deb.sh
          PACKAGE="dist/linux-epub-reader_${{ steps.metadata.outputs.version }}-1_all.deb"
          test -s "$PACKAGE"
          test "$(dpkg-deb -f "$PACKAGE" Package)" = "linux-epub-reader"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "${{ steps.metadata.outputs.version }}-1"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = "all"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Create unpublished draft release with Debian installer
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.metadata.outputs.tag }}" \
            "${{ steps.package.outputs.package }}" \
            --title "Linux EPUB Reader ${{ steps.metadata.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --notes-file "${{ steps.metadata.outputs.notes }}" \
            --draft

      - name: Request pinned Stable and Preview Flatpak builds
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          gh workflow run flatpak.yml --ref main \
            --field source_ref="$GITHUB_SHA" --field release_tag="$TAG"
          gh workflow run flatpak-preview.yml --ref main \
            --field source_ref="$GITHUB_SHA" --field release_tag="$TAG"

      - name: Wait for both verified Flatpak installers
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          VERSION="${{ steps.metadata.outputs.version }}"
          # The standalone Flatpak workflows run their full in-sandbox tests
          # *before* they upload to the draft. A failed build leaves a draft,
          # never a partial published release.
          complete=0
          for attempt in $(seq 1 110); do
            names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if grep -Fxq "linux-epub-reader-${VERSION}.flatpak" <<< "$names" \
                && grep -Fxq "linux-epub-reader-preview-${VERSION}.flatpak" <<< "$names" \
                && grep -Fxq "linux-epub-reader_${VERSION}-1_all.deb" <<< "$names"; then
              complete=1
              break
            fi
            echo "Checking completed release assets (attempt $attempt/110)..."
            sleep 20
          done
          if [ "$complete" -ne 1 ]; then
            echo "Both Flatpak uploads did not complete; leaving release as draft." >&2
            exit 1
          fi

      - name: Download installers, verify and upload SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          VERSION="${{ steps.metadata.outputs.version }}"
          mkdir -p verified
          gh release download "$TAG" \
            --dir verified \
            --pattern "*.deb" --pattern "*.flatpak"
          (
            cd verified
            test -s "linux-epub-reader_${VERSION}-1_all.deb"
            test -s "linux-epub-reader-${VERSION}.flatpak"
            test -s "linux-epub-reader-preview-${VERSION}.flatpak"
            sha256sum \
              "linux-epub-reader_${VERSION}-1_all.deb" \
              "linux-epub-reader-${VERSION}.flatpak" \
              "linux-epub-reader-preview-${VERSION}.flatpak" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          gh release upload "$TAG" verified/SHA256SUMS

      - name: Publish the verified complete release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
