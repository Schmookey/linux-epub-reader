name: Publish Linux EPUB Reader release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"

      - name: Verify source and run tests
        run: |
          python -VV
          python -m py_compile src/linux_epub_reader.py tests/test_reader.py
          bash -n scripts/build-deb.sh
          python -m unittest discover -s tests -v

      - name: Build and verify Debian installer
        id: package
        run: |
          set -euo pipefail
          APP_VERSION="$(grep -m1 '^APP_VERSION = ' src/linux_epub_reader.py | cut -d '"' -f 2)"
          test -n "$APP_VERSION"
          PACKAGE_VERSION="${APP_VERSION}-1"
          PACKAGE="dist/linux-epub-reader_${PACKAGE_VERSION}_all.deb"

          bash scripts/build-deb.sh
          test -f "$PACKAGE"
          dpkg-deb --info "$PACKAGE"
          test "$(dpkg-deb -f "$PACKAGE" Package)" = "linux-epub-reader"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = "all"

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release and attach Debian installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.package.outputs.app_version }}"
          TITLE="Linux EPUB Reader ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          cat > release-notes.md <<'NOTES'
          ## Illustrated welcome-back panel

          This release adds a richer welcome-back page for continuing your last book.

          ### What's included
          - Front-cover artwork on the welcome-back panel, with improved EPUB 2 and EPUB 3 cover detection.
          - Book information including author, publisher, publication date, language, identifier, subjects, chapter count, extracted word count and description when supplied.
          - Saved chapter, chapter position and estimated overall reading progress.
          - A prominent Linux Mint-green **Resume** button.
          - JPEG cover-image support through Pillow.
          - Improved recovery when the last book has moved or is no longer at its saved location.

          ### Reading data and privacy
          The reader keeps the last-book path, reading position and bookmarks in its existing local reading-state file. Book contents and reading history are not uploaded. The application remains designed for offline use.

          ### Notes
          This is a text-oriented EPUB reader, not a browser-grade EPUB renderer. Adobe DRM and ACSM fulfilment are not supported.
          NOTES

          gh release create "$TAG" "${{ steps.package.outputs.package }}" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Build Flatpak and attach it to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run flatpak.yml --ref main \
            --field source_ref=main \
            --field release_tag="v${{ steps.package.outputs.app_version }}"
