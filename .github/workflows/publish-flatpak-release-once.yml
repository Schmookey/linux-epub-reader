name: Publish verified Flatpak to v0.13.7 release

on:
  push:
    branches:
      - ops/publish-flatpak-v0.13.7
    paths:
      - .github/workflows/publish-flatpak-release-once.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the already-tested Flatpak artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Schmookey/linux-epub-reader/actions/artifacts/12765891911/zip" \
            -o /tmp/flatpak-artifact.zip
          unzip -j /tmp/flatpak-artifact.zip '*.flatpak' -d dist
          test -f dist/linux-epub-reader-0.13.7.flatpak
          test "$(find dist -maxdepth 1 -type f -name '*.flatpak' | wc -l)" -eq 1
          echo "Downloaded tested bundle:"
          ls -lh dist/linux-epub-reader-0.13.7.flatpak
          echo "fae1cf9260f0aee772f0f323f2c079e31301d08609a8fdf176f941231ee7addc  dist/linux-epub-reader-0.13.7.flatpak" | sha256sum --check

      - name: Attach verified bundle to the existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.13.7 dist/linux-epub-reader-0.13.7.flatpak \
            --clobber \
            --repo Schmookey/linux-epub-reader
