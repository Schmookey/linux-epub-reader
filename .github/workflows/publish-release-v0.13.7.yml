name: Publish Linux EPUB Reader v0.13.7 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release-v0.13.7.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check syntax and run tests
        run: |
          python -m py_compile src/linux_epub_reader.py tests/test_reader.py
          bash -n scripts/build-deb.sh
          python -m unittest discover -s tests -v

      - name: Build Debian installer
        run: |
          bash scripts/build-deb.sh
          dpkg-deb --info dist/linux-epub-reader_0.13.7-1_all.deb
          test "$(dpkg-deb -f dist/linux-epub-reader_0.13.7-1_all.deb Package)" = "linux-epub-reader"
          test "$(dpkg-deb -f dist/linux-epub-reader_0.13.7-1_all.deb Version)" = "0.13.7-1"
          test "$(dpkg-deb -f dist/linux-epub-reader_0.13.7-1_all.deb Architecture)" = "all"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.13.7
          name: Linux EPUB Reader v0.13.7
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Linux EPUB Reader v0.13.7

            This release updates the welcome page with practical information about reading features, saved reading data, its local file location, and the app's offline-only privacy design.

            ### Included
            - Continuous EPUB reading with a left-hand contents panel.
            - Search, bookmarks, saved reading positions, chapter progress, and full-screen reading (F11; Esc to exit).
            - One default typeface, Atkinson Hyperlegible, and the existing dark theme.
            - Local reading-state storage at `~/.local/share/linux-epub-reader/reading_state.json`.
            - No user accounts, cloud storage, reading-history uploads, analytics, or telemetry are implemented. The project is intended to remain offline-only.

            ### Important limitations
            - This is a text-oriented EPUB reader, not a browser-grade EPUB renderer.
            - Adobe DRM and ACSM fulfilment are not supported. The app shows local explanatory notices for protected or unsupported inputs and does not launch an external reader.
            - The privacy wording describes the app's intended data handling; it is not a blanket legal certification of GDPR compliance.

            The Debian installer is attached below. Automated syntax checks, unit tests, and Debian package metadata checks run as part of the release workflow.
          files: dist/linux-epub-reader_0.13.7-1_all.deb
