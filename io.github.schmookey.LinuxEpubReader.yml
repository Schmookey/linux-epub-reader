app-id: io.github.schmookey.LinuxEpubReader
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: linux-epub-reader

# GitHub release bundle, not a Flathub submission. Do not add network access.
finish-args:
  - --socket=x11
  - --share=ipc
  - --filesystem=home:ro
  # Keep reading-state writes limited to the application's existing state directory.
  - --filesystem=~/.local/share/linux-epub-reader:create
  - --env=TCL_LIBRARY=/app/lib/tcl9.1
  - --env=TK_LIBRARY=/app/lib/tk9.1

modules:
  - name: python-with-tk
    buildsystem: simple
    build-commands:
      - |
        export TCLTK_CFLAGS="-I${FLATPAK_DEST}/include"
        export TCLTK_LIBS="-L${FLATPAK_DEST}/lib -ltcl9tk9.1 -ltcl9.1"
        export LDFLAGS="-Wl,-rpath,${FLATPAK_DEST}/lib"
        ./configure --prefix=${FLATPAK_DEST} --enable-shared --with-ensurepip=no --disable-test-modules
      - make -j2
      - make install
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/python/LICENSE
      - LD_LIBRARY_PATH=${FLATPAK_DEST}/lib TCL_LIBRARY=${FLATPAK_DEST}/lib/tcl9.1 TK_LIBRARY=${FLATPAK_DEST}/lib/tk9.1 ${FLATPAK_DEST}/bin/python3.15 -c 'import tkinter, _tkinter; print("Bundled Python/Tkinter import passed")'
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tar.xz
        sha256: 8b5536d280142ecf6cdfe15d12a21ba1c65e300bbf7b28a8d0cdb849575797de
    modules:
      - name: tcl
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --enable-threads
          - --enable-shared
        post-install:
          - chmod 755 ${FLATPAK_DEST}/lib/libtcl9.1.so
          - install -Dm644 ../license.terms ${FLATPAK_DEST}/share/licenses/tcl/LICENSE
        sources:
          - type: git
            url: https://github.com/tcltk/tcl.git
            tag: core-9-1-0
            commit: 0c6bad08d91fa2ad51f05a50a41f8c1ea82ce985
      - name: tk
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --enable-threads
          - --enable-shared
        post-install:
          - chmod 755 ${FLATPAK_DEST}/lib/libtcl9tk9.1.so
          - install -Dm644 ../license.terms ${FLATPAK_DEST}/share/licenses/tk/LICENSE
        sources:
          - type: git
            url: https://github.com/tcltk/tk.git
            tag: core-9-1-0
            commit: 3f45110c0a568b70f2ebd5412f215e87d199bc7d

  - name: linux-epub-reader
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/linux-epub-reader-launcher ${FLATPAK_DEST}/bin/linux-epub-reader
      - install -Dm644 src/linux_epub_reader.py ${FLATPAK_DEST}/lib/linux-epub-reader/linux_epub_reader.py
      - install -Dm644 packaging/flatpak/io.github.schmookey.LinuxEpubReader.desktop ${FLATPAK_DEST}/share/applications/io.github.schmookey.LinuxEpubReader.desktop
      - install -Dm644 share/icons/hicolor/scalable/apps/linux-epub-reader.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.schmookey.LinuxEpubReader.svg
      - install -Dm644 packaging/flatpak/io.github.schmookey.LinuxEpubReader.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.schmookey.LinuxEpubReader.metainfo.xml
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/io.github.schmookey.LinuxEpubReader/LICENSE
      - install -Dm644 packaging/flatpak/THIRD_PARTY_NOTICES.md ${FLATPAK_DEST}/share/doc/linux-epub-reader/THIRD_PARTY_NOTICES.md
    sources:
      - type: dir
        path: .
